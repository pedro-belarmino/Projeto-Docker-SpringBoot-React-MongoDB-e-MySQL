services:
  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"

  mysql:
    image: mysql:8
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: projetobackdb
    ports:
      - "3306:3306"

  api-mongo:
    build:
      context: ./projetobackMongo
    container_name: api-mongo
    ports:
      - "8081:8081"
    depends_on:
      - mongo

  api-mysql:
    build:
      context: ./projetobackMysql
    container_name: api-mysql
    ports:
      - "8082:8082"
    depends_on:
      - mysql

